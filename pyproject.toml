[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-graph"
version = "0.2.0"
description = "Local-first, governed reasoning memory with typed graph evidence and explicit refusal."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Eyal Nof" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["reasoning", "knowledge-graph", "declared", "local-first", "deterministic", "lowering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
analytics = ["numpy"]          # optional booster: pagerank power-iteration speedup; MUST degrade byte-identically when absent
mcp = ["mcp>=2,<3"]
workbench = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest", "numpy", "mcp>=2,<3", "fastapi>=0.110", "uvicorn>=0.27", "httpx"]

[project.scripts]
reasoning-graph-mcp = "reasoning_graph.mcp_server:main"
reasoning-graph = "reasoning_graph.cli:main"
reasoning-graph-workbench = "reasoning_graph.workbench.app:main"

[tool.setuptools.package-data]
"reasoning_graph.workbench" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.packages.find]
include = ["reasoning_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
