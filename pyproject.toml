[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasoning-graph"
version = "0.1.0"
description = "Declared, confidence-weighted reasoning graphs: retrieve reasoning by traversal instead of re-deriving it in prose. Rung-0 lowering applied to reasoning itself."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Eyal Nof" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["reasoning", "knowledge-graph", "declared", "local-first", "deterministic", "lowering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
analytics = ["numpy"]          # optional booster: pagerank power-iteration speedup; MUST degrade byte-identically when absent
dev = ["pytest", "numpy"]

[project.scripts]
reasoning-graph = "reasoning_graph.cli:main"

[tool.setuptools.packages.find]
include = ["reasoning_graph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
